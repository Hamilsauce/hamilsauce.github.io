<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
  <title>hamhome</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/7.3.0/rxjs.umd.min.js" integrity="sha512-y3JTS47nnpKORJX8Jn1Rlm+QgRIIZHtu3hWxal0e81avPrqUH48yk+aCi+gprT0RMAcpYa0WCkapxe+bpBHD6g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./hamhome3/style.css" />
</head>

<body>
  <div id="app" class="gradient">
    <header id="app-header">
      <div id="app-header-left"></div>
      <div id="app-header-center">
        <h1 id="app-title">hamhome</h1>
      </div>
      <div id="app-header-right"></div>
    </header>
    <section id="app-body">
      <ul id="repo-list"></ul> 
    </section>
    <footer id="app-footer">
      <div class="container">
        footer
      </div>
    </footer>
  </div>
  <script src="./script.js" type="module"></script>
  <script src="./hamhome3/script.js" type="module"></script>
  
  <template data-template="repo-list">
    <ul id="repo-list"></ul> 
  </template>
  
  <template data-template="list-item">
    <li class="list-item">
      <div class="list-item-top-row">
        <div class="repo-name"></div>
      </div>
      <div class="list-item-top-middle">
        
      </div>
      <div class="list-item top-bottom">
        <div class="repo-dates">
          <div class="repo-created-date"></div>
          <div class="repo-updated-date"></div>
          
        </div>
        
      </div>
    </li>
  </template>
  
</body>

</html>
